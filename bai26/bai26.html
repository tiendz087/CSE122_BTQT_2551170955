<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Form đăng ký CLB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style_bai26.css">
</head>

<body>
    <div class="container my-4">
        <div class="card-header bg-success text-white text-center">
            <h3>Đăng ký tham gia CLB Lập trình Web</h3>
        </div>


        <div class="card-body">
            <form>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="formm-label">Họ và Tên</label>
                        <input type="text" class="form-control">
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="formm-label">Mã Sinh Viên</label>
                        <input type="text" class="form-control">
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="formm-label">Email</label>
                        <input type="text" class="form-control">
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="formm-label">Số điện thoại</label>
                        <input type="text" class="form-control">
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label d-block">Trình độ</label>

                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" name="trinhdo">
                        <label class="form-check-label">Cơ bản</label>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label d-block">Trình độ</label>

                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" name="trinhdo">
                        <label class="form-check-label">Khá</label>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label d-block">Trình độ</label>

                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" name="trinhdo">
                        <label class="form-check-label">Tốt</label>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label">Chọn lớp</label>
                    <select class="form-select">
                        <option value="67CNTT1">67CNTT1</option>
                        <option value="67CNTT2">67CNTT2</option>
                        <option value="67CNTT3">67CNTT3</option>
                    </select>
                </div>

                <div class="col-12">
                    <input class="form-check-input" type="checkbox" id="camket">
                    <label class="form-check-label" for="camket">
                        Tôi cam kết tự làm bài và quay video OBS
                    </label>
                </div>

                <div class="col-12 d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="reset" class="btn btn-outline-secondary">Nhập lại</button>
                    <button type="submit" class="btn btn-success">Đăng ký</button>
                </div>
        </div>

        </form>
    </div>
</body>

</html>
