
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh</title>
    <link rel="stylesheet" href="style_bai11.css">
</head>
<body>
    <div class="gallery">
        <h2>Thư viện ảnh Việt Nam</h2>
        <p>Bộ sưu tập 6 danh thắng tiêu biểu — minh họa bằng thẻ figure / figcaption.</p>

        <div class="images">
            <figure>
                <img src="1.png" alt="Vịnh Hạ Long">
                <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
            </figure>

            <figure>
                <img src="2.png" alt="Hang Sơn Đoòng">
                <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>

            <figure>
                <img src="3.png" alt="Thác Bản Giốc">
                <figcaption>Hình 3. Thác Bản Giốc</figcaption>
            </figure>

            <figure>
                <img src="4.png" alt="Fansipan">
                <figcaption>Hình 4. Fansipan</figcaption>
            </figure>

            <figure>
                <img src="5.png" alt="Đồng bằng sông Cửu Long">
                <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
            </figure>

            <figure>
                <img src="6.png" alt="Động Phong Nha">
                <figcaption>Hình 6. Động Phong Nha</figcaption>
            </figure>
        </div>
    </div>
</body>
</html>
