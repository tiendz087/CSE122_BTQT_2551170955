
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form liên hệ</title>
    <link rel="stylesheet" href="style_bai10.css">
</head>
<body>
    <div class="form">
        <div class="header">
            <h2>Liên hệ với chúng tôi</h2>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </div>

        <div class="content">
            <div class="row">
                <div class="field">
                    <label>Họ và tên</label>
                    <input type="text" value="Nguyễn Văn An">
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" value="an.nv@tlu.edu.vn">
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Số điện thoại</label>
                    <input type="tel" value="0987 654 321">
                </div>
                <div class="field">
                    <label>Chủ đề</label>
                    <select>
                        <option>Hỏi về khóa học</option>
                        <option>Hỗ trợ kỹ thuật</option>
                        <option>Khác</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>Nội dung</label>
                <textarea rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
            </div>

            <div class="check">
                <input type="checkbox" checked>
                <label>Tôi đồng ý nhận email phản hồi.</label>
            </div>

            <button type="submit">Gửi liên hệ</button>
            <button type="reset" class="reset">Nhập lại</button>
        </div>
    </div>
</body>
</html>
